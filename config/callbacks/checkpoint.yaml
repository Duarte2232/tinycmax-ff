checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${trainer.default_root_dir}/checkpoints
  monitor: val_loss          # logged as a slash-free alias in litmodule.py
  mode: min
  save_top_k: 3              # keep the 3 best checkpoints
  save_last: true            # always keep last.ckpt (updated every val epoch)
  filename: "top-{epoch:03d}-{val_loss:.4f}"
  auto_insert_metric_name: false
  save_on_train_epoch_end: false   # trigger on validation end, not training end
  verbose: true
